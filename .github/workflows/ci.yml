# SPDX-License-Identifier: MIT
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      # ellipsoid_tree comes from the FetchContent fallback, which also
      # exercises that path on every run.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DLGPSF_BUILD_EXPERIMENTS=ON
      # Experiments and the slow C++ examples are BUILT but never RUN: their
      # failure mode is bit-rot, not wrong numbers, and results legitimately
      # differ across compiler flags (docs/reproducibility.md), so any tight
      # assertion on them would be flaky by construction.
      # Parallelism is chosen by MEMORY, not by core count: the heaviest
      # translation unit peaks near 3 GB of compiler, so a hosted runner
      # (4 cores / 16 GB) can afford 3 jobs and not many more. See
      # docs/installation.md.
      - name: Build
        run: cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run the trivial example
        run: ./build/examples/hello_world

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libeigen3-dev python3-dev
          python3 -m pip install numpy scipy pytest
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLGPSF_BUILD_PYTHON=ON
          -DLGPSF_BUILD_TESTS=OFF -DLGPSF_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build -j 3 --target lgpsf_python
      - name: Test
        run: PYTHONPATH=build/bindings python3 -m pytest bindings/tests -q
      # The integration gate: the whole stack end to end on a public problem.
      - name: Run the end-to-end example
        run: PYTHONPATH=build/bindings python3 examples/operator_fit_frog.py --quick

  pip-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No apt Eigen on purpose: exercises the FetchContent fallback inside a
      # pip build, where both Eigen and ellipsoid_tree must be fetched.
      - name: Build wheel
        run: python3 -m pip wheel . --no-deps -w dist
      - name: Install and test
        run: |
          python3 -m pip install numpy scipy pytest dist/*.whl
          python3 -m pytest bindings/tests -q
      - name: Check the sdist excludes what it should
        run: |
          python3 -m pip install build
          python3 -m build --sdist --outdir sdist .
          python3 - <<'PY'
          import glob, sys, tarfile
          names = tarfile.open(glob.glob("sdist/*.tar.gz")[0]).getnames()
          leaked = sorted({p.split("/")[1] for p in names if "/" in p}
                          & {"archive", "experiments", "dev"})
          if leaked:
              sys.exit(f"sdist should not contain: {leaked}")
          print("sdist excludes archive/, experiments/ and dev/ as intended")
          PY

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, "address,undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLGPSF_BUILD_EXAMPLES=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
      # Serial on purpose. A single sanitizer translation unit here peaks near
      # 8 GB, so two concurrent jobs would exceed a 16 GB hosted runner. This
      # job is slow; that is the cost of it finishing at all.
      - name: Build
        run: cmake --build build -j 1
      - name: Test
        run: ctest --test-dir build --output-on-failure

  direction-of-dependence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lgpsf is a general-purpose library; the problems it was built for are
      # downstream consumers. Nothing shipped, documented or noted here may
      # point into one.
      - name: No private dependencies
        run: python3 tools/check_dependencies.py

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lgpsf.hpp version matches pyproject.toml, CITATION.cff and the Doxyfile
        run: |
          python3 - <<'PY'
          import re, sys, tomllib
          hpp = open("include/lgpsf/lgpsf.hpp").read()
          def macro(tag): return re.search(rf"LGPSF_VERSION_{tag} (\d+)", hpp).group(1)
          header = f"{macro('MAJOR')}.{macro('MINOR')}.{macro('PATCH')}"
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "CITATION.cff": re.search(r'(?m)^version:\s*"?([0-9][0-9.]*)"?',
                                        open("CITATION.cff").read()).group(1),
              "docs/Doxyfile": re.search(r'(?m)^PROJECT_NUMBER\s*=\s*([0-9][0-9.]*)',
                                         open("docs/Doxyfile").read()).group(1),
          }
          print(f"lgpsf.hpp={header}  " + "  ".join(f"{k}={v}" for k, v in found.items()))
          bad = {k: v for k, v in found.items() if v != header}
          if bad:
              sys.exit(f"version mismatch vs lgpsf.hpp ({header}): {bad}")
          print("versions consistent")
          PY
